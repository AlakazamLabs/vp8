name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  conformance:
    name: conformance (WebM test vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the test vectors
        run: crates/vp8-decoder/scripts/fetch-test-vectors.sh "$RUNNER_TEMP/vp8-vectors"
      - name: Conformance test
        run: cargo test -p vp8-decoder --release --features conformance --locked
        env:
          VP8_TEST_VECTORS: ${{ runner.temp }}/vp8-vectors
